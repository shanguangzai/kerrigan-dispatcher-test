name: Kerrigan Manual Dispatch Test

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Static Kerrigan manifest to submit
        type: choice
        options:
          - .kerrigan/ctest-job.yaml
          - .kerrigan/job.yaml
        default: .kerrigan/ctest-job.yaml
      bridge_timeout_sec:
        description: Runner bridge timeout
        type: number
        default: 180

jobs:
  kerrigan:
    runs-on:
      - self-hosted
      - kerrigan
    timeout-minutes: 15
    env:
      KERRIGAN_MANIFEST: ${{ inputs.manifest }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Kerrigan manifest
        run: |
          echo "KERRIGAN_MANIFEST=${KERRIGAN_MANIFEST}"
          sed -n '1,220p' "${KERRIGAN_MANIFEST}"

      - name: Submit Kerrigan session
        run: kerrigan-runner-bridge --timeout-sec "${{ inputs.bridge_timeout_sec }}"
