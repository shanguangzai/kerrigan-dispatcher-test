metadata:
  name: core-develop-bb5dab2-two-devkit-strict-ctest
  labels:
    suite: core-ci-strict
    source_run: "26544517284"
    source_job: "78201436004"

source:
  repository: shanguangzai/kerrigan-dispatcher-test

setup:
  per_devkit:
    - id: prepare-core-strict-runtime
      shell: |
        set -eu
        INSTALL_ROOT=/media/nvme/kerrigan-core-ci-develop-bb5dab219ee5
        PACKAGE_SPEC=core@develop:bb5dab219ee5
        VULCAN_ENV=stg
        export HOME=/home/sima
        export SIMA_CLI_CHECK_FOR_UPDATE=0
        export PATH=/data/sima-cli/.venv/bin:/home/sima/.sima-cli/.venv/bin:/usr/local/bin:/usr/bin:/bin:${PATH:-}
        run_privileged() {
          if [ "$(id -u)" = "0" ]; then
            "$@"
          else
            printf '%s\n' "${DEVKIT_PASSWORD:-edgeai}" | sudo -S -p '' "$@"
          fi
        }
        recovery_step() {
          label="$1"
          shift
          echo "[recovery] ${label}..."
          if run_privileged "$@"; then
            echo "[recovery] ${label} rc=0"
          else
            rc=$?
            echo "[recovery] ${label} rc=${rc}"
          fi
        }
        if [ -d /data/simaai/coprocessing ]; then
          recovery_step "empty coprocessing directory" find /data/simaai/coprocessing -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        else
          echo "[recovery] empty coprocessing skipped: directory not found /data/simaai/coprocessing"
        fi
        free_mb="$(df -Pm / | awk 'NR==2 {print $4}')"
        if [ -n "${free_mb}" ] && [ "${free_mb}" -lt 500 ]; then
          recovery_step "remove /tmp/sima_* for low root free space" sh -c 'rm -rf /tmp/sima_*'
        else
          echo "[recovery] /tmp cleanup skipped: root free space is ${free_mb:-unknown}MB (threshold 500MB)"
        fi
        recovery_step "remoteproc0 stop" sh -c 'echo stop > /sys/class/remoteproc/remoteproc0/state'
        recovery_step "remoteproc1 stop" sh -c 'echo stop > /sys/class/remoteproc/remoteproc1/state'
        recovery_step "remoteproc1 start" sh -c 'echo start > /sys/class/remoteproc/remoteproc1/state'
        recovery_step "remoteproc0 start" sh -c 'echo start > /sys/class/remoteproc/remoteproc0/state'
        recovery_step "remoteproc status" sh -c 'for rp in /sys/class/remoteproc/remoteproc0 /sys/class/remoteproc/remoteproc1; do echo "$rp: $(cat $rp/name) state=$(cat $rp/state)"; done'
        recovery_step "init_mla_memory" /usr/bin/init_mla_memory.sh
        recovery_step "restart simaai-appcomplex.service" systemctl restart simaai-appcomplex.service
        recovery_step "restart simaai-pipeline-manager.service" systemctl restart simaai-pipeline-manager.service
        recovery_step "restart rctd.service" systemctl restart rctd.service
        if ! command -v sima-cli >/dev/null 2>&1; then
          echo "sima-cli not found on devkit" >&2
          exit 1
        fi
        echo "Installing ${PACKAGE_SPEC} from Vulcan env ${VULCAN_ENV} into ${INSTALL_ROOT}"
        sima-cli neat install --env "${VULCAN_ENV}" --type all --install-dir "${INSTALL_ROOT}" "${PACKAGE_SPEC}"
        EXTRAS="$(find "${INSTALL_ROOT}" -maxdepth 1 -type d -name 'sima-neat-*-Linux-extras' | sort | tail -1)"
        if [ -z "${EXTRAS}" ]; then
          echo "Unable to locate extras directory under ${INSTALL_ROOT}" >&2
          exit 1
        fi
        EXTRAS_LIB_DIR="${EXTRAS}/lib/sima-neat"
        EXTRAS_PREFIX="${EXTRAS}"
        TEST_DIR="${EXTRAS_LIB_DIR}/tests"
        TEST_ASSETS_ROOT="${EXTRAS_PREFIX}/share/sima-neat/test-assets"
        INSTALLED_DECODER_FIXTURE="${EXTRAS_LIB_DIR}/test-assets/decoder/dynamic_caps.h264"
        COMPAT_DECODER_FIXTURE="${TEST_DIR}/assets/decoder/dynamic_caps.h264"
        if [ ! -d "${TEST_DIR}" ]; then
          echo "Required installed test path missing: ${TEST_DIR}" >&2
          exit 1
        fi
        if [ -f "${INSTALLED_DECODER_FIXTURE}" ]; then
          mkdir -p "$(dirname "${COMPAT_DECODER_FIXTURE}")"
          cp "${INSTALLED_DECODER_FIXTURE}" "${COMPAT_DECODER_FIXTURE}"
          echo "prepared decoder dynamic fixture compatibility path: ${COMPAT_DECODER_FIXTURE}"
        else
          echo "Required decoder dynamic fixture missing: ${INSTALLED_DECODER_FIXTURE}" >&2
          exit 1
        fi
        find "${EXTRAS_LIB_DIR}" -type f -name CTestTestfile.cmake | sort > /tmp/kerrigan-core-ci-ctest-files.txt
        if [ ! -s /tmp/kerrigan-core-ci-ctest-files.txt ]; then
          echo "No CTestTestfile.cmake files found under ${EXTRAS_LIB_DIR}" >&2
          exit 1
        fi
        while IFS= read -r f; do
          sed -E -i \
            -e "s|/[^\"[:space:]]*/build/tests/|${TEST_DIR}/|g" \
            -e "s|/workspace/core|${EXTRAS_LIB_DIR}|g" \
            -e "s|/[^\"[:space:]]*/test\\.jpg|${TEST_ASSETS_ROOT}/test.jpg|g" \
            -e "s|/opt/toolchain/aarch64/modalix/usr/lib/aarch64-linux-gnu/neat/gst-plugins|/usr/lib/aarch64-linux-gnu/neat/gst-plugins|g" \
            -e "s|/opt/toolchain/aarch64/modalix/usr/lib/aarch64-linux-gnu/neat/runtime|/usr/lib/aarch64-linux-gnu/neat/runtime|g" \
            -e "s|/opt/toolchain/aarch64/modalix/usr/lib/aarch64-linux-gnu|/usr/lib/aarch64-linux-gnu|g" \
            -e "s|/opt/toolchain/aarch64/modalix/usr/lib|/usr/lib|g" \
            "${f}"
        done < /tmp/kerrigan-core-ci-ctest-files.txt
        if grep -R -n -E '/build/tests/' "${EXTRAS_LIB_DIR}" --include CTestTestfile.cmake; then
          echo "CTEST path rebasing incomplete; stale absolute paths remain." >&2
          exit 1
        fi
        ctest --test-dir "${TEST_DIR}" -N --label-regex strict --label-exclude long -E '^(unit_dispatcher_watchdog_test)$' > /tmp/kerrigan-core-ci-strict-tests.txt
        STRICT_COUNT="$(grep -c '^  Test #' /tmp/kerrigan-core-ci-strict-tests.txt || true)"
        echo "prepared core strict CTest runtime from ${EXTRAS}; discovered ${STRICT_COUNT} strict tests"
        # The core workflow runs runtime recovery again after install/rebase before tests.
        recovery_step "remoteproc0 stop" sh -c 'echo stop > /sys/class/remoteproc/remoteproc0/state'
        recovery_step "remoteproc1 stop" sh -c 'echo stop > /sys/class/remoteproc/remoteproc1/state'
        recovery_step "remoteproc1 start" sh -c 'echo start > /sys/class/remoteproc/remoteproc1/state'
        recovery_step "remoteproc0 start" sh -c 'echo start > /sys/class/remoteproc/remoteproc0/state'
        recovery_step "init_mla_memory" /usr/bin/init_mla_memory.sh
        recovery_step "restart simaai-appcomplex.service" systemctl restart simaai-appcomplex.service
        recovery_step "restart simaai-pipeline-manager.service" systemctl restart simaai-pipeline-manager.service
        recovery_step "restart rctd.service" systemctl restart rctd.service
      timeout_sec: 900

