metadata:
  name: single-devkit-core-install
  labels:
    suite: manual
    mode: real-devkit-smoke

source:
  repository: shanguangzai/kerrigan-dispatcher-test
  vulcan_artifacts:
    - env: stg
      name: core
      branch: develop
      tag: latest
      type: minimal
      install_dir: /tmp/kerrigan-core-framework
      skip_devkit_sync: true
      timeout_sec: 600

scheduling:
  strategy: serial
  min_devkits: 1
  max_devkits: 1
  max_parallel: 1
  fail_fast: true
  pools:
    - default
  capabilities:
    board: modalix
    os_type: elxr

tasks:
  - id: core-framework-install-smoke
    type: command
    command:
      shell: |
        echo "core framework install completed on ${KERRIGAN_TARGET_ID}"
        test -d /tmp/kerrigan-core-framework
        for i in $(seq 1 30); do
          echo "post-install heartbeat ${i}/30 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 1
        done
    timeout_sec: 90
