metadata:
  name: manual-dispatch-smoke
  labels:
    suite: manual
    mode: simulation

source:
  repository: shanguangzai/kerrigan-dispatcher-test
  bundle:
    include:
      - tests/**/*.py

scheduling:
  strategy: spread
  max_devkits: 4
  fail_fast: false
  pools:
    - sim-pool
  capabilities:
    board: modalix
    os_type: elxr
    firmware: 2.1.0

tasks:
  - id: manual-shard-a
    type: pytest
    selector: tests/test_slow_suite.py::test_manual_shard_a
    timeout_sec: 60

  - id: manual-shard-b
    type: pytest
    selector: tests/test_slow_suite.py::test_manual_shard_b
    timeout_sec: 60

  - id: manual-shard-c
    type: pytest
    selector: tests/test_slow_suite.py::test_manual_shard_c
    timeout_sec: 60

  - id: manual-shard-d
    type: pytest
    selector: tests/test_slow_suite.py::test_manual_shard_d
    timeout_sec: 60

  - id: manual-shard-e
    type: pytest
    selector: tests/test_slow_suite.py::test_manual_shard_e
    timeout_sec: 60

  - id: manual-shard-f
    type: pytest
    selector: tests/test_slow_suite.py::test_manual_shard_f
    timeout_sec: 60
